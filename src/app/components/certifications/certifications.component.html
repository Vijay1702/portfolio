<section id="certifications" class="certifications">
  <div class="container">
    <div class="section-header" appScrollReveal>
      <span class="section-tag">{{ 'CERTS.TAG' | translate }}</span>
      <h2 class="section-title">
        {{ 'CERTS.TITLE_PRE' | translate }}
        <span class="gradient-text">{{ 'CERTS.TITLE_ACCENT' | translate }}</span>
      </h2>
      <p class="section-subtitle">{{ 'CERTS.SUBTITLE' | translate }}</p>
    </div>

    <div class="grid-3 certs-grid">
      <div
        *ngFor="let cert of certifications; let i = index"
        class="cert-card card"
        appScrollReveal
        [revealDelay]="i * 100"
        [class.award]="cert.isAward"
      >
        <div class="cert-icon">{{ cert.icon }}</div>
        <div class="cert-content">
          <h3 class="cert-title">{{ cert.title | translate }}</h3>
          <p class="cert-issuer">{{ cert.issuer | translate }}</p>
          <p class="cert-desc">{{ cert.description | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
