<section id="certifications" class="certifications">
  <div class="container">
    <div class="section-header fade-up">
      <span class="section-tag">Recognition</span>
      <h2 class="section-title">
        Certifications & <span class="gradient-text">Achievements</span>
      </h2>
      <p class="section-subtitle">Verified achievements and professional certifications.</p>
    </div>

    <div class="grid-3 certs-grid">
      <div
        *ngFor="let cert of certifications; let i = index"
        class="cert-card card fade-up"
        [style.animation-delay]="i * 0.1 + 's'"
        [class.award]="cert.isAward"
      >
        <div class="cert-icon">{{ cert.icon }}</div>
        <div class="cert-content">
          <h3 class="cert-title">{{ cert.title }}</h3>
          <p class="cert-issuer">{{ cert.issuer }}</p>
          <p class="cert-desc">{{ cert.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
