<section id="skills" class="skills">
  <div class="container">
    <div class="section-header fade-up">
      <span class="section-tag">{{ 'SKILLS.TAG' | translate }}</span>
      <h2 class="section-title">
        {{ 'SKILLS.TITLE' | translate | slice: 0 : 5 }}
        <span class="gradient-text">{{ 'SKILLS.TITLE' | translate | slice: 8 }}</span>
      </h2>
      <p class="section-subtitle">
        {{ 'SKILLS.SUBTITLE' | translate }}
      </p>
    </div>

    <div class="grid-3 skills-grid">
      <div
        *ngFor="let group of skills; let i = index"
        class="skill-card card fade-up"
        [style.animation-delay]="i * 0.1 + 's'"
      >
        <div class="skill-icon">{{ group.icon }}</div>
        <h3 class="skill-cat">{{ group.category | translate }}</h3>
        <div class="skill-items">
          <span *ngFor="let item of group.items" class="skill-pill">{{ item }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
